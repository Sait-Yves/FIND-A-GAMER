services:
  # ==========================================
  # Service 1 : Application Next.js (LobbyGamer)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lobbygamer_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - RAWG_API_KEY=${RAWG_API_KEY}
      - NEXT_PUBLIC_RAWG_API_KEY=${NEXT_PUBLIC_RAWG_API_KEY}
      - STITCH_API_KEY=${STITCH_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lobby_network

  # ==========================================
  # Service 2 : Base de données MySQL 8.0
  # ==========================================
  db:
    image: mysql:8.0
    container_name: lobbygamer_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - lobbygamer_db_data:/var/lib/mysql
    networks:
      - lobby_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lobbygamer_db_data:
    name: lobbygamer_mysql_data

networks:
  lobby_network:
    name: lobbygamer_network
    driver: bridge
