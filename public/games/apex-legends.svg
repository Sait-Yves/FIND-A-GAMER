      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="40%" stop-color="#4a1212"/>
      <stop offset="100%" stop-color="#120505"/>
    </linearGradient>
    <linearGradient id="apexRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ff9500"/>
    </linearGradient>
    <pattern id="gridApex" width="25" height="25" patternUnits="userSpaceOnUse">
