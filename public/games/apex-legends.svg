  <text x="300" y="270" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#ff9500" text-anchor="middle" letter-spacing="1.5">RESPAWN • BATTLE ROYALE COMPÉTITIF</text>
