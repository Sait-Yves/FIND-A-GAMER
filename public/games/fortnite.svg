  </g>

  <text x="300" y="235" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="5">FORTNITE</text>
  <text x="300" y="265" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#00f0ff" text-anchor="middle" letter-spacing="1.5">EPIC GAMES • BATTLE ROYALE &amp; ZÉRO BUILD</text>
