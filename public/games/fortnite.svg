<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="bgFn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220b45"/>
      <stop offset="50%" stop-color="#3b1578"/>
      <stop offset="100%" stop-color="#0e0420"/>
    </linearGradient>
    <linearGradient id="fnCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="fnYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600"/>
