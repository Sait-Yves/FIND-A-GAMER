<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="bgHd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a0e"/>
      <stop offset="40%" stop-color="#222b14"/>
      <stop offset="100%" stop-color="#0a0e07"/>
    </linearGradient>
    <linearGradient id="hdYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe600"/>
      <stop offset="100%" stop-color="#ffb700"/>
    </linearGradient>
    <pattern id="gridHd" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffe600" stroke-opacity="0.1" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="600" height="350" fill="url(#bgHd)"/>
  <rect width="600" height="350" fill="url(#gridHd)"/>
  <!-- Helldivers Skull / Wings symbol -->
  <g transform="translate(260, 75)" fill="url(#hdYellow)">
    <!-- Wings -->
    <path d="M 40 10 L 80 30 L 70 45 L 40 30 Z" />
    <path d="M 40 10 L 0 30 L 10 45 L 40 30 Z" />
    <!-- Center Skull -->
    <rect x="25" y="30" width="30" height="28" rx="6" />
    <circle cx="33" cy="42" r="3.5" fill="#141a0e" />
    <circle cx="47" cy="42" r="3.5" fill="#141a0e" />
    <rect x="33" y="55" width="4" height="12" />
    <rect x="43" y="55" width="4" height="12" />
  </g>
  <text x="300" y="240" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">HELLDIVERS 2</text>
  <text x="300" y="270" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffe600" text-anchor="middle" letter-spacing="1.5">ARROWHEAD • COOP GALACTIQUE POUR LA DÉMOCRATIE</text>
</svg>

