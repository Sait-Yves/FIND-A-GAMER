<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="bgMr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b080f"/>
      <stop offset="50%" stop-color="#5a101b"/>
      <stop offset="100%" stop-color="#180306"/>
    </linearGradient>
    <linearGradient id="mrRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3344"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>
    <linearGradient id="mrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdf00"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <pattern id="gridMr" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ff3344" stroke-opacity="0.12" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="600" height="350" fill="url(#bgMr)"/>
  <rect width="600" height="350" fill="url(#gridMr)"/>

  <!-- Marvel Rivals Hero Shield Emblem & "M" Slash -->
  <g transform="translate(255, 60)">
    <!-- Red Marvel Box / Badge -->
    <polygon points="45,5 85,25 85,75 45,95 5,75 5,25" fill="url(#mrRed)" stroke="url(#mrGold)" stroke-width="3"/>
    <!-- Central stylized "M" with energy slash -->
    <path d="M 22 68 L 22 36 L 36 54 L 45 42 L 54 54 L 68 36 L 68 68 L 58 68 L 58 50 L 50 60 L 40 60 L 32 50 L 32 68 Z" fill="#ffffff"/>
    <!-- Dynamic Lightning / Cosmic Streak -->
    <polygon points="35,15 55,15 48,32 58,32 38,62 43,40 33,40" fill="url(#mrGold)" opacity="0.9"/>
  </g>

  <text x="300" y="235" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">MARVEL RIVALS</text>
  <text x="300" y="265" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#ffdf00" text-anchor="middle" letter-spacing="1.5">NETEASE &amp; MARVEL • 6V6 SUPER HERO SHOOTER</text>
</svg>
