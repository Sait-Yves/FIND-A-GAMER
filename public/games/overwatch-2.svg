<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="bgOw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2430"/>
      <stop offset="50%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="owOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9c00"/>
      <stop offset="100%" stop-color="#fa5c00"/>
    </linearGradient>
    <pattern id="gridOw" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ff9c00" stroke-opacity="0.08" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="600" height="350" fill="url(#bgOw)"/>
  <rect width="600" height="350" fill="url(#gridOw)"/>

  <!-- Overwatch Circle & Hands Emblem -->
  <g transform="translate(260, 60)">
    <!-- Top inner orange hands / wings -->
    <path d="M 30 18 C 34 25 38 35 38 48 L 44 48 C 44 32 39 21 34 14 Z" fill="url(#owOrange)"/>
    <path d="M 50 18 C 46 25 42 35 42 48 L 36 48 C 36 32 41 21 46 14 Z" fill="url(#owOrange)"/>
    <!-- Outer Ring Segments -->
    <path d="M 40 4 A 44 44 0 0 0 6 62 L 18 62 A 32 32 0 0 1 40 16 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 40 4 A 44 44 0 0 1 74 62 L 62 62 A 32 32 0 0 0 40 16 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Bottom arc -->
    <path d="M 12 70 A 44 44 0 0 0 68 70 L 58 70 A 32 32 0 0 1 22 70 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Orange "2" Badge -->
    <rect x="70" y="8" width="22" height="26" rx="4" fill="url(#owOrange)"/>
    <text x="81" y="27" font-family="'Space Grotesk', system-ui, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle">2</text>
  </g>

  <text x="300" y="235" font-family="'Space Grotesk', system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">OVERWATCH 2</text>
  <text x="300" y="265" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#ff9c00" text-anchor="middle" letter-spacing="1.5">BLIZZARD • HERO SHOOTER 5V5 / 6V6</text>
</svg>
