<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neonEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4edea3" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Hexagonal Shield Base -->
  <path
    d="M 256,36 L 436,112 L 436,324 Q 436,410 256,476 Q 76,410 76,324 L 76,112 Z"
    fill="url(#bgGrad)"
    stroke="url(#shieldBorder)"
    stroke-width="12"
    stroke-linejoin="round"
  />

  <!-- Top Gamer Nexus Indicator -->
  <circle cx="256" cy="92" r="6" fill="#00f5a0" filter="url(#neonGlow)" />

  <!-- Gaming Controller Body Silhouette -->
  <g filter="url(#neonGlow)">
    <path
      d="M 160,200 C 190,190 322,190 352,200 C 382,210 404,244 394,304 C 386,348 356,368 326,346 C 300,328 284,310 256,310 C 228,310 212,328 186,346 C 156,368 126,348 118,304 C 108,244 130,210 160,200 Z"
      fill="#0b1120"
      stroke="url(#neonEmerald)"
      stroke-width="14"
      stroke-linejoin="round"
    />
    <!-- D-Pad -->
    <path d="M 172,246 h 16 v -16 h 14 v 16 h 16 v 14 h -16 v 16 h -14 v -16 h -16 z" fill="#4edea3" />
    <!-- Buttons -->
    <circle cx="324" cy="240" r="7" fill="#38bdf8" />
    <circle cx="344" cy="254" r="7" fill="#00f5a0" />
    <circle cx="304" cy="254" r="7" fill="#4edea3" />
    <circle cx="324" cy="268" r="7" fill="#06b6d4" />

    <!-- Stylized 'L' Wing -->
    <path d="M 238,236 L 238,274 L 250,274" stroke="#00f5a0" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Stylized 'G' Wing -->
    <path d="M 274,244 A 15,15 0 1,0 274,268 H 262 V 256" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- Energy Spark -->
    <polygon points="256,220 252,238 262,238 250,260 254,244 246,244" fill="#facc15" />
  </g>

  <!-- Bottom Fair-Play Check -->
  <path d="M 216,396 L 244,420 L 298,374" fill="none" stroke="url(#neonEmerald)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />
</svg>
